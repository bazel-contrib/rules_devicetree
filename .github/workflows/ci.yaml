name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Triggers workflow for merge queue events
  merge_group:
    types: [checks_requested]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Can be triggered from the release.yaml workflow
  workflow_call:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    uses: bazel-contrib/.github/.github/workflows/bazel.yaml@v7.7.0
    with:
      bazel_versions: |
        [
          "7.x",
          "8.x",
          "9.x"
        ]
      folders: |
        [
          ".",
          "e2e/custom_toolchain",
          "e2e/smoke"
        ]
      exclude: |
        [
          {"bzlmodEnabled": false},
          {"os": "macos-latest"},
          {"os": "windows-latest"}
        ]
      # Mitigate flakiness from sources outside this repository:
      # - Retry HTTP 5xx from download hosts (e.g. GitHub release assets) for
      #   longer than Bazel's default (~13s total backoff).
      # - Retry loading and analysis (which fetches all needed external repos)
      #   a few times, then run tests exactly once so genuine test failures
      #   are not masked.
      bazel_test_command: |
        set -e
        sudo apt-get update
        sudo apt-get install device-tree-compiler
        http_retry_flags="--http_connector_attempts=12 --http_connector_retry_max_timeout=30s"
        for autodetect in --no@rules_devicetree//devicetree:autodetect_toolchain --@rules_devicetree//devicetree:autodetect_toolchain; do
          for attempt in 1 2 3; do
            bazel build --nobuild //... "$autodetect" $http_retry_flags && break
            [ "$attempt" = 3 ] && exit 1
            echo "Fetch/analysis failed (attempt $attempt); retrying in 60s."
            sleep 60
          done
          bazel test //... "$autodetect" $http_retry_flags
        done
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    name: CI Conclusion
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3
      # Note: possible conclusion values:
      # https://github.com/technote-space/workflow-conclusion-action/blob/main/src/constant.ts
      - name: report success
        if: ${{ env.WORKFLOW_CONCLUSION == 'success' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 0
      - name: report failure
        if: ${{ env.WORKFLOW_CONCLUSION == 'failure' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 1
